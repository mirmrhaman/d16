name: D16 QA and production checks

on:
  push:
    branches: [qa, production]
  pull_request:
    branches: [qa, production]

permissions:
  contents: read

concurrency:
  group: d16-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests, security and database checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require QA promotion for production pull requests
        if: github.event_name == 'pull_request' && github.base_ref == 'production' && (github.head_ref != 'qa' || github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          echo 'Production changes must be promoted from the QA branch in this repository.'
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Disposable local MariaDB only. No QA/production credentials are provided.
      - run: npm run test:database
      - run: npm run build:qa
      - run: npm run build:demo -- --base=/d16/

  package:
    name: Versioned release candidate
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:qa
      - name: Package exact source revision
        id: release
        shell: bash
        run: |
          BASE_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          VERSION="$BASE_VERSION-$GITHUB_REF_NAME.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          node scripts/package-release.mjs --version "$VERSION" --commit "$GITHUB_SHA" --output release-artifacts
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### D16 release candidate: $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Source revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Tests passed. This package has NOT been deployed to DianaHost." >> "$GITHUB_STEP_SUMMARY"
          echo "Production remains locked pending verified hosting, backups and client approval. See docs/CICD.md." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: d16-${{ steps.release.outputs.version }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 90

  # Additive QA UI preview only; never connects to either hosted database.
  # This explicit opt-in is intentionally unset during branch creation.
  qa-preview-build:
    name: Build optional client design preview
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/qa' && vars.D16_QA_PREVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:demo -- --base=/d16/
      - name: SPA fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  qa-preview-deploy:
    name: Publish optional client design preview
    needs: qa-preview-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/qa' && vars.D16_QA_PREVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: d16-qa-pages
      cancel-in-progress: false
    steps:
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
